[project]
name = "obsidian-concat"
version = "0.1.0"
description = "Crawl an Obsidian vault following [[wikilinks]] and concatenate reachable notes into a single file."
readme = "README.md"
authors = [
    { name = "Michal Siniarski", email = "siniarskim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
obsidian-concat = "obsidian_concat.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
